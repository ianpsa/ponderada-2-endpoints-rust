[package]
name = "ponderada-2-endpoints"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow       = "1.0.102"
axum         = { version = "0.8.8", features = ["json"] }
dotenvy      = "0.15.7"
serde        = { version = "1.0.228", features = ["derive"] }
serde_json   = "1.0.149"
tokio        = { version = "1.50.0", features = ["full"] }
tracing      = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
