services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: telemetry_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  #UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: telemetry_app
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
      RABBITMQ_EXCHANGE: "telemetry"
      RABBITMQ_QUEUE: "telemetry.readings"
      RABBITMQ_ROUTING_KEY: "sensor.reading"
      SQLITE_PATH: "/data/telemetry.db"
      DB_POOL_SIZE: "5"
      RUST_LOG: "info"
    volumes:
      - sqlite_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: on-failure

volumes:
  sqlite_data:
